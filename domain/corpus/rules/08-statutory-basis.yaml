# Statutory Basis Quick Reference
# Category: STATUTORY_BASIS
# Snapshot date: 2026-09-11

rules:

  - id: SB-001
    rule: >
      Prevention of Money-Laundering Act, 2002 (Act 15 of 2003) is the primary statute
      governing AML obligations for Reporting Entities in India. It establishes the
      obligations to maintain records, file reports with FIU-IND, and designate a
      Principal Officer.
    category: STATUTORY_BASIS
    subcategory: PMLA_2002
    applies_to:
      - all_reporting_entities
    primary_source:
      document: "Prevention of Money-Laundering Act, 2002 (as amended)"
      url: "https://www.indiacode.nic.in/handle/123456789/2205"
      url_verified: false
      section: "Act 15 of 2003"
      accessed_date: null
    effective_date: null  # in-force date NEEDS-VERIFICATION — see gap DG-11
    evidence_level: PROVEN
    source_authority: STATUTE
    corpus_version: "1.1.1"
    review_status: AUTHOR_ASSERTED
    owner: "Nikhil Pande (corpus maintainer)"
    verified_by: null
    superseded_by: null
    replaces: null
    my_synthesis: >
      PMLA is the parent statute. All product citations should trace back to PMLA
      provisions where possible. Secondary sources (FIU-IND circulars, RBI Master
      Directions) are delegated instruments under PMLA authority.
    last_verified: null
    snapshot_date: "2026-09-11"
    gap_notes: >
      Verify exact in-force date of PMLA 2002. Confirm which version of the India
      Code URL corresponds to the current consolidated version (post-2023 amendments).
      The 2023 PMLA amendment expanded the definition of "proceeds of crime" and
      the list of Reporting Entities — verify exact changes.
    related_rules:
      - STR-001
      - SB-002
      - SB-003

  - id: SB-002
    rule: >
      PMLA 2002, Section 12(1)(b) imposes the obligation on Reporting Entities to
      furnish information in respect of transactions that may constitute a suspicious
      transaction, to the Director, FIU-IND.
    category: STATUTORY_BASIS
    subcategory: PMLA_S12_1B
    applies_to:
      - all_reporting_entities
    primary_source:
      document: "Prevention of Money-Laundering Act, 2002 — Section 12(1)(b)"
      url: "https://www.indiacode.nic.in/handle/123456789/2205"
      url_verified: false
      section: "Section 12(1)(b)"
      accessed_date: null
    effective_date: null
    evidence_level: PROVEN
    source_authority: STATUTE
    corpus_version: "1.1.1"
    review_status: AUTHOR_ASSERTED
    owner: "Nikhil Pande (corpus maintainer)"
    verified_by: null
    superseded_by: null
    replaces: null
    my_synthesis: >
      This is the STR statutory basis. All product STR-related output should cite
